name: Build and Release (Windows & Linux)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (Ubuntu x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libsdl2-dev \
            libmpv-dev \
            curl

      - name: Fetch project dependencies
        run: |
          chmod +x compile/scripts/*.sh
          bash compile/scripts/fetch_deps.sh

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Compile
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Run Backend Tests
        run: |
          echo "=== Executando test_yt_resolver ==="
          ./build/backend/test_yt_resolver
          echo "=== Executando test_audio_playlist ==="
          ./build/backend/test_audio_playlist
          echo "=== Executando test_url_flow ==="
          ./build/backend/test_url_flow

      - name: Build Portable Package
        run: |
          bash compile/scripts/build_linux_portable.sh

      - name: Create Tarball
        run: |
          tar -czf freenamp-linux-x86_64.tar.gz -C build freenamp_portable_linux

      - name: Upload Linux Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freenamp-linux-portable
          path: freenamp-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Build AppImage (Optional)
        run: |
          bash compile/scripts/build_appimage.sh || echo "AppImage build skipped or non-fatal failure"

      - name: Upload AppImage Artifact
        if: hashFiles('build/Freenamp-x86_64.AppImage') != ''
        uses: actions/upload-artifact@v4
        with:
          name: freenamp-linux-appimage
          path: build/Freenamp-x86_64.AppImage

  build-windows:
    name: Windows (MinGW x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Fetch project dependencies
        shell: pwsh
        run: |
          .\compile\scripts\fetch_deps.ps1

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -B build -G "Ninja" -S . -DCMAKE_BUILD_TYPE=Release

      - name: Compile
        shell: msys2 {0}
        run: |
          cmake --build build --config Release

      - name: Run Backend Tests
        shell: msys2 {0}
        run: |
          echo "=== Executando test_yt_resolver ==="
          ./build/backend/test_yt_resolver.exe
          echo "=== Executando test_audio_playlist ==="
          ./build/backend/test_audio_playlist.exe
          echo "=== Executando test_url_flow ==="
          ./build/backend/test_url_flow.exe

      - name: Build Portable Package
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          .\compile\scripts\build_portable_release.ps1

      - name: Create Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "build\freenamp_portable\*" -DestinationPath "freenamp-windows-x64.zip" -Force

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freenamp-windows-portable
          path: freenamp-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release directory
        run: mkdir -p dist

      - name: Download Linux Portable Artifact
        uses: actions/download-artifact@v4
        with:
          name: freenamp-linux-portable
          path: dist/

      - name: Download Windows Portable Artifact
        uses: actions/download-artifact@v4
        with:
          name: freenamp-windows-portable
          path: dist/

      - name: Download AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: freenamp-linux-appimage
          path: dist/
        continue-on-error: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Freenamp {0}', github.ref_name) || 'Freenamp (Continuous Release)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          files: |
            dist/*
