name: Build and Package (Windows & Linux)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux (Ubuntu x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libsdl2-dev \
            libmpv-dev \
            curl

      - name: Fetch project dependencies
        run: |
          chmod +x compile/scripts/*.sh
          bash compile/scripts/fetch_deps.sh

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Compile
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Run Backend Tests
        run: |
          echo "=== Executando test_yt_resolver ==="
          ./build/backend/test_yt_resolver
          echo "=== Executando test_audio_playlist ==="
          ./build/backend/test_audio_playlist
          echo "=== Executando test_url_flow ==="
          ./build/backend/test_url_flow

      - name: Build Portable Package
        run: |
          bash compile/scripts/build_linux_portable.sh

      - name: Create Tarball
        run: |
          tar -czf freenamp_portable_linux.tar.gz -C build freenamp_portable_linux

      - name: Upload Linux Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freenamp-portable-linux-x86_64
          path: freenamp_portable_linux.tar.gz
          if-no-files-found: error

  build-windows:
    name: Windows (MinGW x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW Toolchain
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Fetch project dependencies
        shell: pwsh
        run: |
          .\compile\scripts\fetch_deps.ps1

      - name: Configure CMake
        run: |
          cmake -B build -G "MinGW Makefiles" -S . -DCMAKE_BUILD_TYPE=Release

      - name: Compile
        run: |
          cmake --build build --config Release -j4

      - name: Run Backend Tests
        run: |
          echo "=== Executando test_yt_resolver ==="
          .\build\backend\test_yt_resolver.exe
          echo "=== Executando test_audio_playlist ==="
          .\build\backend\test_audio_playlist.exe
          echo "=== Executando test_url_flow ==="
          .\build\backend\test_url_flow.exe

      - name: Build Portable Package
        shell: pwsh
        run: |
          .\compile\scripts\build_portable_release.ps1

      - name: Create Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "build\freenamp_portable\*" -DestinationPath "freenamp_portable_windows.zip" -Force

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freenamp-portable-windows-x64
          path: freenamp_portable_windows.zip
          if-no-files-found: error
